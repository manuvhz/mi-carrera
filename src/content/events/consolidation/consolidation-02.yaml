events:
  - id: consolidation-026
    title: La deuda que nadie vio lejos de casa — Consolidación
    description: "Una nota breve te cita en la cancha agrietada del barrio. tu madre va directo al asunto: el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La deuda que nadie vio lejos de casa — Consolidación”."
    stage: consolidation
    category: renovación
    tags:
      - renovación
      - consolidation
      - independent
    rarity: common
    ageMin: 20
    ageMax: 22
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: respaldar
        text: Respaldar públicamente a tu madre durante “La deuda que nadie vio lejos de casa — Consolidación”
        riskLabel: Riesgo bajo
        visibleHint: Fortalece una alianza y te expone ante quienes mandan.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: Tu voz cambia la reunión en la cancha agrietada del barrio. No todos están de acuerdo, pero tu madre deja de estar a solas y la relación adquiere una deuda nueva.
        flagsToAdd:
          - consolidation-026-respaldar
      - id: mantenerse-aparte
        text: Mantenerte al margen durante “La deuda que nadie vio lejos de casa — Consolidación” y concentrarte en tu propio lugar
        riskLabel: Riesgo moderado
        visibleHint: Protege tus minutos; el vestuario puede leerlo como distancia.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: La discusión continúa sin ti. Conservas tu posición, aunque la próxima vez que cruzas a tu madre en la cancha agrietada del barrio queda claro que tu ausencia también fue una decisión.
        flagsToAdd:
          - consolidation-026-mantenerse-aparte
  - id: consolidation-027
    title: La llamada sin tu nombre lejos de casa — Consolidación
    description: El entrenamiento debía ser normal en la radio comunitaria, pero tu capitán pide detenerlo. Cuenta delante de todos que un rival te ofrece una tregua que podría cambiar años de competencia. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La llamada sin tu nombre lejos de casa — Consolidación” deja de ser un problema privado.
    stage: consolidation
    category: selección
    tags:
      - selección
      - consolidation
      - narrative-chain
    rarity: common
    ageMin: 21
    ageMax: 22
    baseWeight: 10
    oncePerCareer: true
    chainId: cadena-12
    choices:
      - id: esperar
        text: Pedir tiempo para revisar “La llamada sin tu nombre lejos de casa — Consolidación” con la familia
        riskLabel: Riesgo moderado
        visibleHint: Reduce decisiones impulsivas, pero la oferta puede cambiar.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: La espera permite ver una condición que nadie había explicado. La propuesta pierde brillo, pero la conversación familiar evita que la radio comunitaria se convierta en un punto sin regreso.
        flagsToAdd:
          - consolidation-027-esperar
      - id: aceptar
        text: Aceptar ahora y convertir “La llamada sin tu nombre lejos de casa — Consolidación” en una apuesta personal
        riskLabel: Riesgo alto
        visibleHint: Asegura la oportunidad y aumenta el costo de adaptación.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Das tu palabra antes de salir de la radio comunitaria. tu capitán celebra la valentía, mientras tú entiendes que la parte difícil empieza cuando se apagan las felicitaciones.
        flagsToAdd:
          - consolidation-027-aceptar
  - id: consolidation-028
    title: La lista entreabierta lejos de casa — Consolidación
    description: "De camino a el vestuario visitante, el técnico interino admite que lleva semanas ocultando algo: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. El episodio, que luego llamarán “La lista entreabierta lejos de casa — Consolidación”, exige una respuesta antes de llegar."
    stage: consolidation
    category: táctica
    tags:
      - táctica
      - consolidation
      - independent
    rarity: common
    ageMin: 22
    ageMax: 22
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: hablar-privado
        text: Resolver “La lista entreabierta lejos de casa — Consolidación” en privado con el técnico interino
        riskLabel: Riesgo alto
        visibleHint: Evita el ruido externo; otras personas no conocerán tu versión.
        effects:
          - path: family
            operation: add
            value: 3
          - path: technique
            operation: add
            value: -1
        result: La charla privada baja la tensión. No hay disculpas perfectas, pero ambos salen de el vestuario visitante con una versión compartida y el compromiso de sostenerla.
        flagsToAdd:
          - consolidation-028-hablar-privado
      - id: hacer-publico
        text: Contar tu versión de “La lista entreabierta lejos de casa — Consolidación” antes de que otros la definan
        riskLabel: Resultado impredecible
        visibleHint: Recupera la narrativa y alimenta la atención pública.
        effects:
          - path: discipline
            operation: add
            value: 4
          - path: family
            operation: add
            value: -2
        result: Tu mensaje cambia la conversación alrededor de el vestuario visitante. La afición entiende tus razones; el técnico interino, en cambio, lamenta haber conocido tu respuesta al mismo tiempo que todos.
        flagsToAdd:
          - consolidation-028-hacer-publico
  - id: consolidation-029
    title: La promesa más larga lejos de casa — Consolidación
    description: La puerta de el aeropuerto de una ciudad desconocida está a punto de cerrarse cuando aparece la entrenadora de la selección. Te advierte que dos personas que te ayudaron esperan decisiones incompatibles. El vestuario observará si tus palabras coinciden con tus actos. Aceptar esa realidad será el primer paso de “La promesa más larga lejos de casa — Consolidación”.
    stage: consolidation
    category: lesión
    tags:
      - lesión
      - consolidation
      - independent
    rarity: common
    ageMin: 19
    ageMax: 22
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: seguir-plan
        text: Seguir el plan acordado para atravesar “La promesa más larga lejos de casa — Consolidación”
        riskLabel: Resultado impredecible
        visibleHint: Construye disciplina y limita tu capacidad de improvisar.
        effects:
          - path: finances
            operation: add
            value: 3
          - path: talent
            operation: add
            value: -1
        result: Cumples cada paso aunque el partido pida otra cosa. En el aeropuerto de una ciudad desconocida, la entrenadora de la selección valora tu disciplina y anota también que renunciaste a una ocasión de cambiar el ritmo.
        flagsToAdd:
          - consolidation-029-seguir-plan
      - id: improvisar
        text: Cambiar el plan en el momento decisivo de “La promesa más larga lejos de casa — Consolidación”
        riskLabel: Riesgo bajo
        visibleHint: Puede mostrar creatividad o romper la confianza táctica.
        effects:
          - path: resilience
            operation: add
            value: 4
          - path: finances
            operation: add
            value: -2
        result: La improvisación sorprende a todos en el aeropuerto de una ciudad desconocida. Abre un instante de ventaja, pero la mirada de la entrenadora de la selección deja la evaluación pendiente para después.
        flagsToAdd:
          - consolidation-029-improvisar
  - id: consolidation-030
    title: La puerta inesperada lejos de casa — Consolidación
    description: En plena etapa de consolidación, la oficina del club se convierte en escenario de una decisión incómoda. un cazatalentos de paso confirma que tu nombre abre una puerta, pero también desplaza a otra persona. El resultado deportivo importa menos que la confianza que está en juego. Todo queda suspendido alrededor de “La puerta inesperada lejos de casa — Consolidación”.
    stage: consolidation
    category: directiva
    tags:
      - directiva
      - consolidation
      - independent
    rarity: common
    ageMin: 20
    ageMax: 22
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: ceder
        text: Ceder protagonismo para que el grupo resuelva “La puerta inesperada lejos de casa — Consolidación”
        riskLabel: Riesgo bajo
        visibleHint: Refuerza al equipo y reduce tu visibilidad individual.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: Otra persona toma el centro de la escena y responde bien. Tu gesto pasa casi inadvertido fuera de la oficina del club, aunque un cazatalentos de paso entiende exactamente lo que entregaste.
        flagsToAdd:
          - consolidation-030-ceder
      - id: liderar
        text: Ponerte al frente y cargar con el desenlace de “La puerta inesperada lejos de casa — Consolidación”
        riskLabel: Riesgo moderado
        visibleHint: Aumenta tu influencia y hace tuyo cualquier fracaso.
        effects:
          - path: family
            operation: add
            value: 4
          - path: fitness
            operation: add
            value: -2
        result: Das el primer paso y el grupo te sigue. Al terminar en la oficina del club, nadie duda de quién tomó la responsabilidad; el resultado futuro llevará tu nombre.
        flagsToAdd:
          - consolidation-030-liderar
  - id: consolidation-031
