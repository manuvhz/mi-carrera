        flagsToAdd:
          - consolidation-031-decidir
  - id: consolidation-032
    title: La banca del barrio lejos de casa — Consolidación
    description: "La noticia llega durante una jornada en la clínica deportiva: una oferta tentadora implica dejar atrás a quien creyó en ti. el profesor de matemáticas conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La banca del barrio lejos de casa — Consolidación”."
