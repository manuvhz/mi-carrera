            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Resuelves lo urgente sin explicar cómo. el profesor de matemáticas admira tu determinación, aunque nota el cansancio que intentas esconder después de salir de la clínica deportiva.
        flagsToAdd:
          - consolidation-032-asumir-costo
  - id: consolidation-033
    title: El rumor prestados lejos de casa — Consolidación
    description: "Nadie pensaba hablar del asunto en un amistoso de pretemporada, hasta que la vecina que organiza el torneo rompe el silencio: una promesa antigua choca con la oportunidad de esta semana. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “El rumor prestados lejos de casa — Consolidación” en algo más importante que el resultado del fin de semana."
