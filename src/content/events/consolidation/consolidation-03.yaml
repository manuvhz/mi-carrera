          - consolidation-056-asumir-costo
  - id: consolidation-057
    title: La banca del barrio cuando cambió el vestuario — Consolidación
    description: El entrenamiento debía ser normal en la clínica deportiva, pero el profesor de matemáticas pide detenerlo. Cuenta delante de todos que una oferta tentadora implica dejar atrás a quien creyó en ti. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La banca del barrio cuando cambió el vestuario — Consolidación” deja de ser un problema privado.
