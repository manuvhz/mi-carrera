      - id: escuchar
        text: Escuchar a un cazatalentos de paso y acordar una salida para “La puerta inesperada cuando cambió el vestuario — Consolidación”
        riskLabel: Riesgo moderado
        visibleHint: Conserva la confianza, aunque cedes parte del control.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: En la oficina del club, la conversación encuentra un acuerdo imperfecto. un cazatalentos de paso recuerda que escuchaste antes de imponer tu respuesta; el costo llega pronto, pero la confianza sobrevive a “La puerta inesperada cuando cambió el vestuario — Consolidación”.
        flagsToAdd:
