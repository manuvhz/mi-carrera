        effects:
          - path: family
            operation: add
            value: 4
          - path: fitness
            operation: add
            value: -2
        result: Actúas antes de que alguien pueda detenerte. La oportunidad sigue viva, pero un cazatalentos de paso se entera después y el silencio en la oficina del club pesa más que el resultado inmediato.
        flagsToAdd:
          - consolidation-055-decidir
  - id: consolidation-056
    title: La prueba del viejo rival cuando cambió el vestuario — Consolidación
    description: "Una nota breve te cita en el estadio de tu primer partido. un compañero recién llegado va directo al asunto: una lesión pasada vuelve a doler sin aparecer en los exámenes. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La prueba del viejo rival cuando cambió el vestuario — Consolidación”."
