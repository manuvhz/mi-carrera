      - narrative-chain
    rarity: uncommon
    ageMin: 21
    ageMax: 22
    baseWeight: 6
    oncePerCareer: true
    chainId: cadena-13
    choices:
      - id: esperar
        text: Pedir tiempo para revisar “La deuda que nadie vio cuando cambió el vestuario — Consolidación” con la familia
        riskLabel: Riesgo moderado
        visibleHint: Reduce decisiones impulsivas, pero la oferta puede cambiar.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
