        flagsToAdd:
          - consolidation-051-aceptar
  - id: consolidation-052
    title: La llamada sin tu nombre cuando cambió el vestuario — Consolidación
    description: "La noticia llega durante una jornada en la radio comunitaria: un rival te ofrece una tregua que podría cambiar años de competencia. tu capitán conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La llamada sin tu nombre cuando cambió el vestuario — Consolidación”."
    stage: consolidation
    category: táctica
    tags:
      - táctica
      - consolidation
      - special-rare
    rarity: uncommon
    ageMin: 22
    ageMax: 22
    baseWeight: 6
    oncePerCareer: true
    choices:
      - id: hablar-privado
        text: Resolver “La llamada sin tu nombre cuando cambió el vestuario — Consolidación” en privado con tu capitán
        riskLabel: Riesgo alto
        visibleHint: Evita el ruido externo; otras personas no conocerán tu versión.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: La charla privada baja la tensión. No hay disculpas perfectas, pero ambos salen de la radio comunitaria con una versión compartida y el compromiso de sostenerla.
        flagsToAdd:
          - consolidation-052-hablar-privado
      - id: hacer-publico
        text: Contar tu versión de “La llamada sin tu nombre cuando cambió el vestuario — Consolidación” antes de que otros la definan
        riskLabel: Resultado impredecible
        visibleHint: Recupera la narrativa y alimenta la atención pública.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Tu mensaje cambia la conversación alrededor de la radio comunitaria. La afición entiende tus razones; tu capitán, en cambio, lamenta haber conocido tu respuesta al mismo tiempo que todos.
        flagsToAdd:
          - consolidation-052-hacer-publico
  - id: consolidation-053
    title: La lista entreabierta cuando cambió el vestuario — Consolidación
    description: "Nadie pensaba hablar del asunto en el vestuario visitante, hasta que el técnico interino rompe el silencio: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “La lista entreabierta cuando cambió el vestuario — Consolidación” en algo más importante que el resultado del fin de semana."
