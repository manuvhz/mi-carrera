    description: "Nadie pensaba hablar del asunto en un amistoso de pretemporada, hasta que la vecina que organiza el torneo rompe el silencio: una promesa antigua choca con la oportunidad de esta semana. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “El rumor prestados que volvió años después — Consolidación” en algo más importante que el resultado del fin de semana."
