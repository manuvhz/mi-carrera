      - id: competir
        text: Guardar el problema y competir mientras “La prueba del viejo rival que volvió años después — Consolidación” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de el estadio de tu primer partido, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - consolidation-081-competir
  - id: consolidation-082
    title: La banca del barrio que volvió años después — Consolidación
    description: "La noticia llega durante una jornada en la clínica deportiva: una oferta tentadora implica dejar atrás a quien creyó en ti. el profesor de matemáticas conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La banca del barrio que volvió años después — Consolidación”."
