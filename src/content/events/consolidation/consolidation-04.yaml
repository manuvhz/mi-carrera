        riskLabel: Resultado impredecible
        visibleHint: La transparencia protege tu futuro; la ocasión puede pasar.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: La reacción en el estadio de tu primer partido es más fría de lo que esperabas, pero un compañero recién llegado deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
