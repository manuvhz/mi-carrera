events:
  - id: consolidation-076
    title: La deuda que nadie vio que volvió años después — Consolidación
    description: "Una nota breve te cita en la cancha agrietada del barrio. tu madre va directo al asunto: el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La deuda que nadie vio que volvió años después — Consolidación”."
    stage: consolidation
    category: táctica
    tags:
      - táctica
      - consolidation
      - independent
    rarity: rare
    ageMin: 22
    ageMax: 22
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: hablar-privado
        text: Resolver “La deuda que nadie vio que volvió años después — Consolidación” en privado con tu madre
        riskLabel: Riesgo alto
        visibleHint: Evita el ruido externo; otras personas no conocerán tu versión.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: La charla privada baja la tensión. No hay disculpas perfectas, pero ambos salen de la cancha agrietada del barrio con una versión compartida y el compromiso de sostenerla.
        flagsToAdd:
          - consolidation-076-hablar-privado
      - id: hacer-publico
        text: Contar tu versión de “La deuda que nadie vio que volvió años después — Consolidación” antes de que otros la definan
        riskLabel: Resultado impredecible
        visibleHint: Recupera la narrativa y alimenta la atención pública.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Tu mensaje cambia la conversación alrededor de la cancha agrietada del barrio. La afición entiende tus razones; tu madre, en cambio, lamenta haber conocido tu respuesta al mismo tiempo que todos.
        flagsToAdd:
          - consolidation-076-hacer-publico
  - id: consolidation-077
    title: La llamada sin tu nombre que volvió años después — Consolidación
    description: El entrenamiento debía ser normal en la radio comunitaria, pero tu capitán pide detenerlo. Cuenta delante de todos que un rival te ofrece una tregua que podría cambiar años de competencia. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La llamada sin tu nombre que volvió años después — Consolidación” deja de ser un problema privado.
    stage: consolidation
    category: lesión
    tags:
      - lesión
      - consolidation
      - independent
    rarity: rare
    ageMin: 19
    ageMax: 22
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: seguir-plan
        text: Seguir el plan acordado para atravesar “La llamada sin tu nombre que volvió años después — Consolidación”
        riskLabel: Resultado impredecible
        visibleHint: Construye disciplina y limita tu capacidad de improvisar.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: Cumples cada paso aunque el partido pida otra cosa. En la radio comunitaria, tu capitán valora tu disciplina y anota también que renunciaste a una ocasión de cambiar el ritmo.
        flagsToAdd:
          - consolidation-077-seguir-plan
      - id: improvisar
        text: Cambiar el plan en el momento decisivo de “La llamada sin tu nombre que volvió años después — Consolidación”
        riskLabel: Riesgo bajo
        visibleHint: Puede mostrar creatividad o romper la confianza táctica.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: La improvisación sorprende a todos en la radio comunitaria. Abre un instante de ventaja, pero la mirada de tu capitán deja la evaluación pendiente para después.
        flagsToAdd:
          - consolidation-077-improvisar
  - id: consolidation-078
    title: La lista entreabierta que volvió años después — Consolidación
    description: "De camino a el vestuario visitante, el técnico interino admite que lleva semanas ocultando algo: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. El episodio, que luego llamarán “La lista entreabierta que volvió años después — Consolidación”, exige una respuesta antes de llegar."
    stage: consolidation
    category: directiva
    tags:
      - directiva
      - consolidation
      - independent
    rarity: rare
    ageMin: 20
    ageMax: 22
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: ceder
        text: Ceder protagonismo para que el grupo resuelva “La lista entreabierta que volvió años después — Consolidación”
        riskLabel: Riesgo bajo
        visibleHint: Refuerza al equipo y reduce tu visibilidad individual.
        effects:
          - path: family
            operation: add
            value: 3
          - path: technique
            operation: add
            value: -1
        result: Otra persona toma el centro de la escena y responde bien. Tu gesto pasa casi inadvertido fuera de el vestuario visitante, aunque el técnico interino entiende exactamente lo que entregaste.
        flagsToAdd:
          - consolidation-078-ceder
      - id: liderar
        text: Ponerte al frente y cargar con el desenlace de “La lista entreabierta que volvió años después — Consolidación”
        riskLabel: Riesgo moderado
        visibleHint: Aumenta tu influencia y hace tuyo cualquier fracaso.
        effects:
          - path: discipline
            operation: add
            value: 4
          - path: family
            operation: add
            value: -2
        result: Das el primer paso y el grupo te sigue. Al terminar en el vestuario visitante, nadie duda de quién tomó la responsabilidad; el resultado futuro llevará tu nombre.
        flagsToAdd:
          - consolidation-078-liderar
  - id: consolidation-079
    title: La promesa más larga que volvió años después — Consolidación
    description: La puerta de el aeropuerto de una ciudad desconocida está a punto de cerrarse cuando aparece la entrenadora de la selección. Te advierte que dos personas que te ayudaron esperan decisiones incompatibles. El vestuario observará si tus palabras coinciden con tus actos. Aceptar esa realidad será el primer paso de “La promesa más larga que volvió años después — Consolidación”.
    stage: consolidation
    category: adaptación
    tags:
      - adaptación
      - consolidation
      - narrative-chain
    rarity: rare
    ageMin: 21
    ageMax: 22
    baseWeight: 3
    oncePerCareer: true
    chainId: cadena-14
    choices:
      - id: escuchar
        text: Escuchar a la entrenadora de la selección y acordar una salida para “La promesa más larga que volvió años después — Consolidación”
        riskLabel: Riesgo moderado
        visibleHint: Conserva la confianza, aunque cedes parte del control.
        effects:
          - path: finances
            operation: add
            value: 3
          - path: talent
            operation: add
            value: -1
        result: En el aeropuerto de una ciudad desconocida, la conversación encuentra un acuerdo imperfecto. la entrenadora de la selección recuerda que escuchaste antes de imponer tu respuesta; el costo llega pronto, pero la confianza sobrevive a “La promesa más larga que volvió años después — Consolidación”.
        flagsToAdd:
          - consolidation-079-escuchar
      - id: decidir
        text: Resolver “La promesa más larga que volvió años después — Consolidación” por tu cuenta antes de que cierre la oportunidad
        riskLabel: Riesgo alto
        visibleHint: Ganas velocidad y autonomía; una relación queda bajo presión.
        effects:
          - path: resilience
            operation: add
            value: 4
          - path: finances
            operation: add
            value: -2
        result: Actúas antes de que alguien pueda detenerte. La oportunidad sigue viva, pero la entrenadora de la selección se entera después y el silencio en el aeropuerto de una ciudad desconocida pesa más que el resultado inmediato.
        flagsToAdd:
          - consolidation-079-decidir
  - id: consolidation-080
    title: La puerta inesperada que volvió años después — Consolidación
    description: En plena etapa de consolidación, la oficina del club se convierte en escenario de una decisión incómoda. un cazatalentos de paso confirma que tu nombre abre una puerta, pero también desplaza a otra persona. El resultado deportivo importa menos que la confianza que está en juego. Todo queda suspendido alrededor de “La puerta inesperada que volvió años después — Consolidación”.
    stage: consolidation
    category: rivalidad
    tags:
      - rivalidad
      - consolidation
      - independent
    rarity: rare
    ageMin: 22
    ageMax: 22
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: pedir-ayuda
        text: Contar lo ocurrido en “La puerta inesperada que volvió años después — Consolidación” y pedir ayuda a la comunidad
        riskLabel: Riesgo alto
        visibleHint: Reparte la carga, pero hace público un problema personal.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: La ayuda aparece de lugares inesperados. En la oficina del club varias personas aportan poco y juntas cambian el desenlace; ahora también sienten que tu historia les pertenece.
        flagsToAdd:
          - consolidation-080-pedir-ayuda
      - id: asumir-costo
        text: Asumir a solas el costo de “La puerta inesperada que volvió años después — Consolidación”
        riskLabel: Resultado impredecible
        visibleHint: Protege la intimidad y demuestra autonomía, a cambio de energía.
        effects:
          - path: family
            operation: add
            value: 4
          - path: fitness
            operation: add
            value: -2
        result: Resuelves lo urgente sin explicar cómo. un cazatalentos de paso admira tu determinación, aunque nota el cansancio que intentas esconder después de salir de la oficina del club.
        flagsToAdd:
          - consolidation-080-asumir-costo
  - id: consolidation-081
    title: La prueba del viejo rival que volvió años después — Consolidación
    description: un compañero recién llegado te espera en el estadio de tu primer partido cuando el resto ya se ha marchado. Explica que una lesión pasada vuelve a doler sin aparecer en los exámenes. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “La prueba del viejo rival que volvió años después — Consolidación”.
