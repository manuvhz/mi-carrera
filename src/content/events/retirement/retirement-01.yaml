    description: "Una nota breve te cita en la plaza donde aprendiste a dominar el balón. un antiguo mentor va directo al asunto: el club exige una respuesta antes de que puedas hablar con tu familia. Hay una salida segura, pero su costo solo se notará con el tiempo. Hay pocos minutos para decidir cómo quieres que termine “La prueba bajo la media junto a la familia — Retiro y legado”."
