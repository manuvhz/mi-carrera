          - retirement-003-liderar
  - id: retirement-004
    title: La visita del capitán junto a la familia — Retiro y legado
    description: La puerta de la terminal del último bus está a punto de cerrarse cuando aparece la afición organizada. Te advierte que el dinero solucionaría un problema urgente, pero reduce tus minutos. Elegir pronto ayuda al club; esperar protege tu futuro. Aceptar esa realidad será el primer paso de “La visita del capitán junto a la familia — Retiro y legado”.
