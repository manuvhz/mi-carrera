        flagsToAdd:
          - retirement-001-hacer-publico
  - id: retirement-002
    title: La banca sin dueño junto a la familia — Retiro y legado
    description: El entrenamiento debía ser normal en la despedida de un compañero, pero el entrenador Salcedo pide detenerlo. Cuenta delante de todos que el partido más importante coincide con una fecha decisiva para tu hogar. Esta vez, el talento no basta para resolver el problema. De pronto, “La banca sin dueño junto a la familia — Retiro y legado” deja de ser un problema privado.
