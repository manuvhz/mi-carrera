  - id: retirement-003
    title: El rumor a lápiz junto a la familia — Retiro y legado
    description: "De camino a el túnel antes de una final, tu representante admite que lleva semanas ocultando algo: el capitán te pide guardar silencio sobre un problema del vestuario. Nadie puede garantizar que la oportunidad vuelva a aparecer. El episodio, que luego llamarán “El rumor a lápiz junto a la familia — Retiro y legado”, exige una respuesta antes de llegar."
