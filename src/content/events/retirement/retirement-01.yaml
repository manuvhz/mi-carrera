  - id: retirement-005
    title: La distancia de las decisiones junto a la familia — Retiro y legado
    description: En plena etapa de retiro y legado, la sala de estudio se convierte en escenario de una decisión incómoda. la profesora Emilia confirma que el equipo necesita que juegues en una posición que nunca has entrenado. Lo que hagas quedará en la memoria del barrio durante años. Todo queda suspendido alrededor de “La distancia de las decisiones junto a la familia — Retiro y legado”.
