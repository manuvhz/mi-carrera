        flagsToAdd:
          - academy-002-liderar
  - id: academy-003
    title: La llave hasta casa junto a la familia — Formación juvenil
    description: "Nadie pensaba hablar del asunto en un amistoso de pretemporada, hasta que la vecina que organiza el torneo rompe el silencio: la nueva generación cuestiona las costumbres que ayudaste a construir. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “La llave hasta casa junto a la familia — Formación juvenil” en algo más importante que el resultado del fin de semana."
