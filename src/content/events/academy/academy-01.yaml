            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de un patio escolar cubierto de lluvia, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - academy-005-competir
