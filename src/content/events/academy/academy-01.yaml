  - id: academy-004
    title: El último bus antes del partido junto a la familia — Formación juvenil
    description: Al terminar la sesión en una concentración internacional, encuentras a la presidenta del barrio con una propuesta inesperada. El problema es que el cansancio comienza a afectar tus estudios y tus entrenamientos. El vestuario observará si tus palabras coinciden con tus actos. Tu respuesta dará sentido al recuerdo de “El último bus antes del partido junto a la familia — Formación juvenil”.
