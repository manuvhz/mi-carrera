        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: La reacción en un patio escolar cubierto de lluvia es más fría de lo que esperabas, pero la directiva deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
          - academy-005-ser-honesto
      - id: competir
        text: Guardar el problema y competir mientras “Los guayos antes del amanecer junto a la familia — Formación juvenil” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: family
            operation: add
            value: 4
