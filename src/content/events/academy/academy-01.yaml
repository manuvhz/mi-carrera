  - id: academy-002
    title: La noche de la grada junto a la familia — Formación juvenil
    description: "La noticia llega durante una jornada en la clínica deportiva: una molestia física aparece justo cuando por fin te observan. el profesor de matemáticas conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La noche de la grada junto a la familia — Formación juvenil”."
