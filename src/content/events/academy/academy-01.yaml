        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: Otra persona toma el centro de la escena y responde bien. Tu gesto pasa casi inadvertido fuera de la clínica deportiva, aunque el profesor de matemáticas entiende exactamente lo que entregaste.
        flagsToAdd:
          - academy-002-ceder
      - id: liderar
        text: Ponerte al frente y cargar con el desenlace de “La noche de la grada junto a la familia — Formación juvenil”
        riskLabel: Riesgo moderado
