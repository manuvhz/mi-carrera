            operation: add
            value: -1
        result: Cumples cada paso aunque el partido pida otra cosa. En un entrenamiento a puerta cerrada, Nico, tu rival de infancia valora tu disciplina y anota también que renunciaste a una ocasión de cambiar el ritmo.
        flagsToAdd:
          - academy-081-seguir-plan
