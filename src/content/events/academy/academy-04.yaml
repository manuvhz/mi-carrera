        effects:
          - path: family
            operation: add
            value: 4
          - path: fitness
            operation: add
            value: -2
        result: Tu mensaje cambia la conversación alrededor de un patio escolar cubierto de lluvia. La afición entiende tus razones; la directiva, en cambio, lamenta haber conocido tu respuesta al mismo tiempo que todos.
        flagsToAdd:
          - academy-080-hacer-publico
  - id: academy-081
    title: El vendaje bajo la media que volvió años después — Formación juvenil
    description: Nico, tu rival de infancia te espera en un entrenamiento a puerta cerrada cuando el resto ya se ha marchado. Explica que el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “El vendaje bajo la media que volvió años después — Formación juvenil”.
