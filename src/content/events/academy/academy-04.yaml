    ageMin: 14
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: hablar-privado
        text: Resolver “Los guayos antes del amanecer que volvió años después — Formación juvenil” en privado con la directiva
        riskLabel: Riesgo alto
        visibleHint: Evita el ruido externo; otras personas no conocerán tu versión.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: La charla privada baja la tensión. No hay disculpas perfectas, pero ambos salen de un patio escolar cubierto de lluvia con una versión compartida y el compromiso de sostenerla.
        flagsToAdd:
          - academy-080-hablar-privado
      - id: hacer-publico
        text: Contar tu versión de “Los guayos antes del amanecer que volvió años después — Formación juvenil” antes de que otros la definan
        riskLabel: Resultado impredecible
