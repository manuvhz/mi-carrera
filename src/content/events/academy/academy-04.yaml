events:
  - id: academy-076
    title: La tregua bajo la lluvia que volvió años después — Formación juvenil
    description: "Una nota breve te cita en el estadio de tu primer partido. un compañero recién llegado va directo al asunto: una versión incompleta de la historia ya circula entre la afición. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La tregua bajo la lluvia que volvió años después — Formación juvenil”."
    stage: academy
    category: disciplina
    tags:
      - disciplina
      - academy
      - independent
    rarity: rare
    ageMin: 13
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: pedir-ayuda
        text: Contar lo ocurrido en “La tregua bajo la lluvia que volvió años después — Formación juvenil” y pedir ayuda a la comunidad
        riskLabel: Riesgo alto
        visibleHint: Reparte la carga, pero hace público un problema personal.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: La ayuda aparece de lugares inesperados. En el estadio de tu primer partido varias personas aportan poco y juntas cambian el desenlace; ahora también sienten que tu historia les pertenece.
        flagsToAdd:
          - academy-076-pedir-ayuda
      - id: asumir-costo
        text: Asumir a solas el costo de “La tregua bajo la lluvia que volvió años después — Formación juvenil”
        riskLabel: Resultado impredecible
        visibleHint: Protege la intimidad y demuestra autonomía, a cambio de energía.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Resuelves lo urgente sin explicar cómo. un compañero recién llegado admira tu determinación, aunque nota el cansancio que intentas esconder después de salir de el estadio de tu primer partido.
        flagsToAdd:
          - academy-076-asumir-costo
  - id: academy-077
    title: La noche de la grada que volvió años después — Formación juvenil
    description: El entrenamiento debía ser normal en la clínica deportiva, pero el profesor de matemáticas pide detenerlo. Cuenta delante de todos que una molestia física aparece justo cuando por fin te observan. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La noche de la grada que volvió años después — Formación juvenil” deja de ser un problema privado.
    stage: academy
    category: nutrición
    tags:
      - nutrición
      - academy
      - independent
    rarity: rare
    ageMin: 14
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: ser-honesto
        text: Decir toda la verdad sobre “La noche de la grada que volvió años después — Formación juvenil”, incluso si pierdes el lugar
        riskLabel: Resultado impredecible
        visibleHint: La transparencia protege tu futuro; la ocasión puede pasar.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: La reacción en la clínica deportiva es más fría de lo que esperabas, pero el profesor de matemáticas deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
          - academy-077-ser-honesto
      - id: competir
        text: Guardar el problema y competir mientras “La noche de la grada que volvió años después — Formación juvenil” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de la clínica deportiva, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - academy-077-competir
  - id: academy-078
    title: La llave hasta casa que volvió años después — Formación juvenil
    description: "De camino a un amistoso de pretemporada, la vecina que organiza el torneo admite que lleva semanas ocultando algo: la nueva generación cuestiona las costumbres que ayudaste a construir. La prensa conocerá una parte, pero no las razones completas. El episodio, que luego llamarán “La llave hasta casa que volvió años después — Formación juvenil”, exige una respuesta antes de llegar."
    stage: academy
    category: competencia
    tags:
      - competencia
      - academy
      - independent
    rarity: rare
    ageMin: 15
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
    choices:
      - id: respaldar
        text: Respaldar públicamente a la vecina que organiza el torneo durante “La llave hasta casa que volvió años después — Formación juvenil”
        riskLabel: Riesgo bajo
        visibleHint: Fortalece una alianza y te expone ante quienes mandan.
        effects:
          - path: family
            operation: add
            value: 3
          - path: technique
            operation: add
            value: -1
        result: Tu voz cambia la reunión en un amistoso de pretemporada. No todos están de acuerdo, pero la vecina que organiza el torneo deja de estar a solas y la relación adquiere una deuda nueva.
        flagsToAdd:
          - academy-078-respaldar
      - id: mantenerse-aparte
        text: Mantenerte al margen durante “La llave hasta casa que volvió años después — Formación juvenil” y concentrarte en tu propio lugar
        riskLabel: Riesgo moderado
        visibleHint: Protege tus minutos; el vestuario puede leerlo como distancia.
        effects:
          - path: discipline
            operation: add
            value: 4
          - path: family
            operation: add
            value: -2
        result: La discusión continúa sin ti. Conservas tu posición, aunque la próxima vez que cruzas a la vecina que organiza el torneo en un amistoso de pretemporada queda claro que tu ausencia también fue una decisión.
        flagsToAdd:
          - academy-078-mantenerse-aparte
  - id: academy-079
    title: El último bus antes del partido que volvió años después — Formación juvenil
    description: La puerta de una concentración internacional está a punto de cerrarse cuando aparece la presidenta del barrio. Te advierte que el cansancio comienza a afectar tus estudios y tus entrenamientos. El vestuario observará si tus palabras coinciden con tus actos. Aceptar esa realidad será el primer paso de “El último bus antes del partido que volvió años después — Formación juvenil”.
    stage: academy
    category: familia
    tags:
      - familia
      - academy
      - narrative-chain
    rarity: rare
    ageMin: 13
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
    chainId: cadena-07
    choices:
      - id: esperar
        text: Pedir tiempo para revisar “El último bus antes del partido que volvió años después — Formación juvenil” con la familia
        riskLabel: Riesgo moderado
        visibleHint: Reduce decisiones impulsivas, pero la oferta puede cambiar.
        effects:
          - path: finances
            operation: add
            value: 3
          - path: talent
            operation: add
            value: -1
        result: La espera permite ver una condición que nadie había explicado. La propuesta pierde brillo, pero la conversación familiar evita que una concentración internacional se convierta en un punto sin regreso.
        flagsToAdd:
          - academy-079-esperar
      - id: aceptar
        text: Aceptar ahora y convertir “El último bus antes del partido que volvió años después — Formación juvenil” en una apuesta personal
        riskLabel: Riesgo alto
        visibleHint: Asegura la oportunidad y aumenta el costo de adaptación.
        effects:
          - path: resilience
            operation: add
            value: 4
          - path: finances
            operation: add
            value: -2
        result: Das tu palabra antes de salir de una concentración internacional. la presidenta del barrio celebra la valentía, mientras tú entiendes que la parte difícil empieza cuando se apagan las felicitaciones.
        flagsToAdd:
          - academy-079-aceptar
  - id: academy-080
    title: Los guayos antes del amanecer que volvió años después — Formación juvenil
    description: En plena etapa de formación juvenil, un patio escolar cubierto de lluvia se convierte en escenario de una decisión incómoda. la directiva confirma que la derrota ha dividido al grupo y nadie quiere dar el primer paso. El resultado deportivo importa menos que la confianza que está en juego. Todo queda suspendido alrededor de “Los guayos antes del amanecer que volvió años después — Formación juvenil”.
    stage: academy
    category: torneo juvenil
    tags:
      - torneo juvenil
      - academy
      - independent
