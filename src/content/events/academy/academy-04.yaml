          - path: community
            operation: add
            value: -1
        result: Otra persona toma el centro de la escena y responde bien. Tu gesto pasa casi inadvertido fuera de una pensión lejos de casa, aunque el juvenil que ocupa tu puesto entiende exactamente lo que entregaste.
        flagsToAdd:
          - academy-082-ceder
      - id: liderar
        text: Ponerte al frente y cargar con el desenlace de “El silencio sin dueño que volvió años después — Formación juvenil”
        riskLabel: Riesgo moderado
        visibleHint: Aumenta tu influencia y hace tuyo cualquier fracaso.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Das el primer paso y el grupo te sigue. Al terminar en una pensión lejos de casa, nadie duda de quién tomó la responsabilidad; el resultado futuro llevará tu nombre.
        flagsToAdd:
          - academy-082-liderar
  - id: academy-083
    title: El dorsal a lápiz que volvió años después — Formación juvenil
    description: "Nadie pensaba hablar del asunto en el banco de suplentes, hasta que el médico del equipo rompe el silencio: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “El dorsal a lápiz que volvió años después — Formación juvenil” en algo más importante que el resultado del fin de semana."
