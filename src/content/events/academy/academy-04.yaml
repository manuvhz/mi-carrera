        text: Cambiar el plan en el momento decisivo de “El vendaje bajo la media que volvió años después — Formación juvenil”
        riskLabel: Riesgo bajo
        visibleHint: Puede mostrar creatividad o romper la confianza táctica.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: La improvisación sorprende a todos en un entrenamiento a puerta cerrada. Abre un instante de ventaja, pero la mirada de Nico, tu rival de infancia deja la evaluación pendiente para después.
        flagsToAdd:
          - academy-081-improvisar
  - id: academy-082
    title: El silencio sin dueño que volvió años después — Formación juvenil
    description: "La noticia llega durante una jornada en una pensión lejos de casa: un rival te ofrece una tregua que podría cambiar años de competencia. el juvenil que ocupa tu puesto conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “El silencio sin dueño que volvió años después — Formación juvenil”."
    stage: academy
    category: estudios
    tags:
      - estudios
      - academy
      - special-rare
    rarity: rare
    ageMin: 13
    ageMax: 15
    baseWeight: 3
    oncePerCareer: true
