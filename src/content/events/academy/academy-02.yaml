        result: Tu mensaje cambia la conversación alrededor de una pensión lejos de casa. La afición entiende tus razones; el juvenil que ocupa tu puesto, en cambio, lamenta haber conocido tu respuesta al mismo tiempo que todos.
        flagsToAdd:
          - academy-032-hacer-publico
  - id: academy-033
    title: El dorsal a lápiz lejos de casa — Formación juvenil
    description: "Nadie pensaba hablar del asunto en el banco de suplentes, hasta que el médico del equipo rompe el silencio: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “El dorsal a lápiz lejos de casa — Formación juvenil” en algo más importante que el resultado del fin de semana."
