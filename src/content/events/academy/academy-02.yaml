events:
  - id: academy-026
    title: La tregua bajo la lluvia lejos de casa — Formación juvenil
    description: "Una nota breve te cita en el estadio de tu primer partido. un compañero recién llegado va directo al asunto: una versión incompleta de la historia ya circula entre la afición. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La tregua bajo la lluvia lejos de casa — Formación juvenil”."
    stage: academy
    category: estudios
    tags:
      - estudios
      - academy
      - independent
    rarity: common
    ageMin: 14
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: ceder
        text: Ceder protagonismo para que el grupo resuelva “La tregua bajo la lluvia lejos de casa — Formación juvenil”
        riskLabel: Riesgo bajo
        visibleHint: Refuerza al equipo y reduce tu visibilidad individual.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: Otra persona toma el centro de la escena y responde bien. Tu gesto pasa casi inadvertido fuera de el estadio de tu primer partido, aunque un compañero recién llegado entiende exactamente lo que entregaste.
        flagsToAdd:
          - academy-026-ceder
      - id: liderar
        text: Ponerte al frente y cargar con el desenlace de “La tregua bajo la lluvia lejos de casa — Formación juvenil”
        riskLabel: Riesgo moderado
        visibleHint: Aumenta tu influencia y hace tuyo cualquier fracaso.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Das el primer paso y el grupo te sigue. Al terminar en el estadio de tu primer partido, nadie duda de quién tomó la responsabilidad; el resultado futuro llevará tu nombre.
        flagsToAdd:
          - academy-026-liderar
  - id: academy-027
    title: La noche de la grada lejos de casa — Formación juvenil
    description: El entrenamiento debía ser normal en la clínica deportiva, pero el profesor de matemáticas pide detenerlo. Cuenta delante de todos que una molestia física aparece justo cuando por fin te observan. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La noche de la grada lejos de casa — Formación juvenil” deja de ser un problema privado.
    stage: academy
    category: beca
    tags:
      - beca
      - academy
      - narrative-chain
    rarity: common
    ageMin: 15
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    chainId: cadena-05
    choices:
      - id: escuchar
        text: Escuchar a el profesor de matemáticas y acordar una salida para “La noche de la grada lejos de casa — Formación juvenil”
        riskLabel: Riesgo moderado
        visibleHint: Conserva la confianza, aunque cedes parte del control.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: En la clínica deportiva, la conversación encuentra un acuerdo imperfecto. el profesor de matemáticas recuerda que escuchaste antes de imponer tu respuesta; el costo llega pronto, pero la confianza sobrevive a “La noche de la grada lejos de casa — Formación juvenil”.
        flagsToAdd:
          - academy-027-escuchar
      - id: decidir
        text: Resolver “La noche de la grada lejos de casa — Formación juvenil” por tu cuenta antes de que cierre la oportunidad
        riskLabel: Riesgo alto
        visibleHint: Ganas velocidad y autonomía; una relación queda bajo presión.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Actúas antes de que alguien pueda detenerte. La oportunidad sigue viva, pero el profesor de matemáticas se entera después y el silencio en la clínica deportiva pesa más que el resultado inmediato.
        flagsToAdd:
          - academy-027-decidir
  - id: academy-028
    title: La llave hasta casa lejos de casa — Formación juvenil
    description: "De camino a un amistoso de pretemporada, la vecina que organiza el torneo admite que lleva semanas ocultando algo: la nueva generación cuestiona las costumbres que ayudaste a construir. La prensa conocerá una parte, pero no las razones completas. El episodio, que luego llamarán “La llave hasta casa lejos de casa — Formación juvenil”, exige una respuesta antes de llegar."
    stage: academy
    category: disciplina
    tags:
      - disciplina
      - academy
      - independent
    rarity: common
    ageMin: 13
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: pedir-ayuda
        text: Contar lo ocurrido en “La llave hasta casa lejos de casa — Formación juvenil” y pedir ayuda a la comunidad
        riskLabel: Riesgo alto
        visibleHint: Reparte la carga, pero hace público un problema personal.
        effects:
          - path: family
            operation: add
            value: 3
          - path: technique
            operation: add
            value: -1
        result: La ayuda aparece de lugares inesperados. En un amistoso de pretemporada varias personas aportan poco y juntas cambian el desenlace; ahora también sienten que tu historia les pertenece.
        flagsToAdd:
          - academy-028-pedir-ayuda
      - id: asumir-costo
        text: Asumir a solas el costo de “La llave hasta casa lejos de casa — Formación juvenil”
        riskLabel: Resultado impredecible
        visibleHint: Protege la intimidad y demuestra autonomía, a cambio de energía.
        effects:
          - path: discipline
            operation: add
            value: 4
          - path: family
            operation: add
            value: -2
        result: Resuelves lo urgente sin explicar cómo. la vecina que organiza el torneo admira tu determinación, aunque nota el cansancio que intentas esconder después de salir de un amistoso de pretemporada.
        flagsToAdd:
          - academy-028-asumir-costo
  - id: academy-029
    title: El último bus antes del partido lejos de casa — Formación juvenil
    description: La puerta de una concentración internacional está a punto de cerrarse cuando aparece la presidenta del barrio. Te advierte que el cansancio comienza a afectar tus estudios y tus entrenamientos. El vestuario observará si tus palabras coinciden con tus actos. Aceptar esa realidad será el primer paso de “El último bus antes del partido lejos de casa — Formación juvenil”.
    stage: academy
    category: nutrición
    tags:
      - nutrición
      - academy
      - independent
    rarity: common
    ageMin: 14
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: ser-honesto
        text: Decir toda la verdad sobre “El último bus antes del partido lejos de casa — Formación juvenil”, incluso si pierdes el lugar
        riskLabel: Resultado impredecible
        visibleHint: La transparencia protege tu futuro; la ocasión puede pasar.
        effects:
          - path: finances
            operation: add
            value: 3
          - path: talent
            operation: add
            value: -1
        result: La reacción en una concentración internacional es más fría de lo que esperabas, pero la presidenta del barrio deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
          - academy-029-ser-honesto
      - id: competir
        text: Guardar el problema y competir mientras “El último bus antes del partido lejos de casa — Formación juvenil” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: resilience
            operation: add
            value: 4
          - path: finances
            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de una concentración internacional, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - academy-029-competir
  - id: academy-030
    title: Los guayos antes del amanecer lejos de casa — Formación juvenil
    description: En plena etapa de formación juvenil, un patio escolar cubierto de lluvia se convierte en escenario de una decisión incómoda. la directiva confirma que la derrota ha dividido al grupo y nadie quiere dar el primer paso. El resultado deportivo importa menos que la confianza que está en juego. Todo queda suspendido alrededor de “Los guayos antes del amanecer lejos de casa — Formación juvenil”.
    stage: academy
    category: competencia
    tags:
      - competencia
      - academy
      - independent
    rarity: common
    ageMin: 15
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: respaldar
        text: Respaldar públicamente a la directiva durante “Los guayos antes del amanecer lejos de casa — Formación juvenil”
        riskLabel: Riesgo bajo
        visibleHint: Fortalece una alianza y te expone ante quienes mandan.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: Tu voz cambia la reunión en un patio escolar cubierto de lluvia. No todos están de acuerdo, pero la directiva deja de estar a solas y la relación adquiere una deuda nueva.
        flagsToAdd:
          - academy-030-respaldar
      - id: mantenerse-aparte
        text: Mantenerte al margen durante “Los guayos antes del amanecer lejos de casa — Formación juvenil” y concentrarte en tu propio lugar
        riskLabel: Riesgo moderado
        visibleHint: Protege tus minutos; el vestuario puede leerlo como distancia.
        effects:
          - path: family
            operation: add
            value: 4
          - path: fitness
            operation: add
            value: -2
        result: La discusión continúa sin ti. Conservas tu posición, aunque la próxima vez que cruzas a la directiva en un patio escolar cubierto de lluvia queda claro que tu ausencia también fue una decisión.
        flagsToAdd:
          - academy-030-mantenerse-aparte
  - id: academy-031
    title: El vendaje bajo la media lejos de casa — Formación juvenil
    description: Nico, tu rival de infancia te espera en un entrenamiento a puerta cerrada cuando el resto ya se ha marchado. Explica que el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “El vendaje bajo la media lejos de casa — Formación juvenil”.
