    ageMin: 13
    ageMax: 15
    baseWeight: 10
    oncePerCareer: true
    chainId: cadena-05
    choices:
      - id: esperar
        text: Pedir tiempo para revisar “El vendaje bajo la media lejos de casa — Formación juvenil” con la familia
        riskLabel: Riesgo moderado
        visibleHint: Reduce decisiones impulsivas, pero la oferta puede cambiar.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: La espera permite ver una condición que nadie había explicado. La propuesta pierde brillo, pero la conversación familiar evita que un entrenamiento a puerta cerrada se convierta en un punto sin regreso.
        flagsToAdd:
          - academy-031-esperar
      - id: aceptar
        text: Aceptar ahora y convertir “El vendaje bajo la media lejos de casa — Formación juvenil” en una apuesta personal
        riskLabel: Riesgo alto
        visibleHint: Asegura la oportunidad y aumenta el costo de adaptación.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Das tu palabra antes de salir de un entrenamiento a puerta cerrada. Nico, tu rival de infancia celebra la valentía, mientras tú entiendes que la parte difícil empieza cuando se apagan las felicitaciones.
        flagsToAdd:
          - academy-031-aceptar
  - id: academy-032
