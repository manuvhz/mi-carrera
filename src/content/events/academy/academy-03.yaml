        riskLabel: Riesgo moderado
        visibleHint: Reduce decisiones impulsivas, pero la oferta puede cambiar.
        effects:
          - path: fitness
            operation: add
            value: 3
          - path: confidence
            operation: add
            value: -1
        result: La espera permite ver una condición que nadie había explicado. La propuesta pierde brillo, pero la conversación familiar evita que un patio escolar cubierto de lluvia se convierta en un punto sin regreso.
        flagsToAdd:
          - academy-055-esperar
      - id: aceptar
