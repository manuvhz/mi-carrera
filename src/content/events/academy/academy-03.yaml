            value: -2
        result: Das tu palabra antes de salir de un patio escolar cubierto de lluvia. la directiva celebra la valentía, mientras tú entiendes que la parte difícil empieza cuando se apagan las felicitaciones.
        flagsToAdd:
          - academy-055-aceptar
