          - academy-054-mantenerse-aparte
  - id: academy-055
    title: Los guayos antes del amanecer cuando cambió el vestuario — Formación juvenil
    description: La rutina cambia al llegar a un patio escolar cubierto de lluvia. Allí descubres junto a la directiva que la derrota ha dividido al grupo y nadie quiere dar el primer paso. El resultado deportivo importa menos que la confianza que está en juego. Nadie levanta la voz, pero “Los guayos antes del amanecer cuando cambió el vestuario — Formación juvenil” puede dividir el antes y el después de esta temporada.
