events:
  - id: academy-051
    title: La tregua bajo la lluvia cuando cambió el vestuario — Formación juvenil
    description: un compañero recién llegado te espera en el estadio de tu primer partido cuando el resto ya se ha marchado. Explica que una versión incompleta de la historia ya circula entre la afición. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “La tregua bajo la lluvia cuando cambió el vestuario — Formación juvenil”.
    stage: academy
    category: beca
    tags:
      - beca
      - academy
      - narrative-chain
    rarity: uncommon
    ageMin: 15
    ageMax: 15
    baseWeight: 6
    oncePerCareer: true
    chainId: cadena-06
    choices:
      - id: escuchar
        text: Escuchar a un compañero recién llegado y acordar una salida para “La tregua bajo la lluvia cuando cambió el vestuario — Formación juvenil”
        riskLabel: Riesgo moderado
        visibleHint: Conserva la confianza, aunque cedes parte del control.
        effects:
          - path: discipline
            operation: add
            value: 3
          - path: reputation
            operation: add
            value: -1
        result: En el estadio de tu primer partido, la conversación encuentra un acuerdo imperfecto. un compañero recién llegado recuerda que escuchaste antes de imponer tu respuesta; el costo llega pronto, pero la confianza sobrevive a “La tregua bajo la lluvia cuando cambió el vestuario — Formación juvenil”.
        flagsToAdd:
          - academy-051-escuchar
      - id: decidir
        text: Resolver “La tregua bajo la lluvia cuando cambió el vestuario — Formación juvenil” por tu cuenta antes de que cierre la oportunidad
        riskLabel: Riesgo alto
        visibleHint: Ganas velocidad y autonomía; una relación queda bajo presión.
        effects:
          - path: finances
            operation: add
            value: 4
          - path: discipline
            operation: add
            value: -2
        result: Actúas antes de que alguien pueda detenerte. La oportunidad sigue viva, pero un compañero recién llegado se entera después y el silencio en el estadio de tu primer partido pesa más que el resultado inmediato.
        flagsToAdd:
          - academy-051-decidir
  - id: academy-052
    title: La noche de la grada cuando cambió el vestuario — Formación juvenil
    description: "La noticia llega durante una jornada en la clínica deportiva: una molestia física aparece justo cuando por fin te observan. el profesor de matemáticas conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La noche de la grada cuando cambió el vestuario — Formación juvenil”."
    stage: academy
    category: disciplina
    tags:
      - disciplina
      - academy
      - special-rare
    rarity: uncommon
    ageMin: 13
    ageMax: 15
    baseWeight: 6
    oncePerCareer: true
    choices:
      - id: pedir-ayuda
        text: Contar lo ocurrido en “La noche de la grada cuando cambió el vestuario — Formación juvenil” y pedir ayuda a la comunidad
        riskLabel: Riesgo alto
        visibleHint: Reparte la carga, pero hace público un problema personal.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: La ayuda aparece de lugares inesperados. En la clínica deportiva varias personas aportan poco y juntas cambian el desenlace; ahora también sienten que tu historia les pertenece.
        flagsToAdd:
          - academy-052-pedir-ayuda
      - id: asumir-costo
        text: Asumir a solas el costo de “La noche de la grada cuando cambió el vestuario — Formación juvenil”
        riskLabel: Resultado impredecible
        visibleHint: Protege la intimidad y demuestra autonomía, a cambio de energía.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Resuelves lo urgente sin explicar cómo. el profesor de matemáticas admira tu determinación, aunque nota el cansancio que intentas esconder después de salir de la clínica deportiva.
        flagsToAdd:
          - academy-052-asumir-costo
  - id: academy-053
    title: La llave hasta casa cuando cambió el vestuario — Formación juvenil
    description: "Nadie pensaba hablar del asunto en un amistoso de pretemporada, hasta que la vecina que organiza el torneo rompe el silencio: la nueva generación cuestiona las costumbres que ayudaste a construir. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “La llave hasta casa cuando cambió el vestuario — Formación juvenil” en algo más importante que el resultado del fin de semana."
    stage: academy
    category: nutrición
    tags:
      - nutrición
      - academy
      - independent
    rarity: uncommon
    ageMin: 14
    ageMax: 15
    baseWeight: 6
    oncePerCareer: true
    choices:
      - id: ser-honesto
        text: Decir toda la verdad sobre “La llave hasta casa cuando cambió el vestuario — Formación juvenil”, incluso si pierdes el lugar
        riskLabel: Resultado impredecible
        visibleHint: La transparencia protege tu futuro; la ocasión puede pasar.
        effects:
          - path: family
            operation: add
            value: 3
          - path: technique
            operation: add
            value: -1
        result: La reacción en un amistoso de pretemporada es más fría de lo que esperabas, pero la vecina que organiza el torneo deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
          - academy-053-ser-honesto
      - id: competir
        text: Guardar el problema y competir mientras “La llave hasta casa cuando cambió el vestuario — Formación juvenil” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: discipline
            operation: add
            value: 4
          - path: family
            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de un amistoso de pretemporada, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - academy-053-competir
  - id: academy-054
    title: El último bus antes del partido cuando cambió el vestuario — Formación juvenil
    description: Al terminar la sesión en una concentración internacional, encuentras a la presidenta del barrio con una propuesta inesperada. El problema es que el cansancio comienza a afectar tus estudios y tus entrenamientos. El vestuario observará si tus palabras coinciden con tus actos. Tu respuesta dará sentido al recuerdo de “El último bus antes del partido cuando cambió el vestuario — Formación juvenil”.
    stage: academy
    category: competencia
