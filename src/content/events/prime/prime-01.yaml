  - id: prime-002
    title: El relevo del barrio junto a la familia — Mejor etapa
    description: "La noticia llega durante una jornada en una pensión lejos de casa: la familia prepara un plan distinto para tu futuro. el juvenil que ocupa tu puesto conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “El relevo del barrio junto a la familia — Mejor etapa”."
