events:
  - id: prime-001
    title: La cancha del viejo rival junto a la familia — Mejor etapa
    description: Nico, tu rival de infancia te espera en un entrenamiento a puerta cerrada cuando el resto ya se ha marchado. Explica que una decisión rápida puede salvar la temporada o romper la confianza. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “La cancha del viejo rival junto a la familia — Mejor etapa”.
    stage: prime
    category: final
    tags:
      - final
      - prime
      - narrative-chain
    rarity: common
    ageMin: 23
    ageMax: 27
    baseWeight: 10
    oncePerCareer: true
    chainId: cadena-15
    choices:
      - id: esperar
