    description: "Nadie pensaba hablar del asunto en el banco de suplentes, hasta que el médico del equipo rompe el silencio: un error ajeno amenaza con caer sobre tu reputación. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “El retrato prestados cuando cambió el vestuario — Mejor etapa” en algo más importante que el resultado del fin de semana."
