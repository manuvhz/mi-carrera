  - id: prime-026
    title: La cancha del viejo rival lejos de casa — Mejor etapa
    description: "Una nota breve te cita en un entrenamiento a puerta cerrada. Nico, tu rival de infancia va directo al asunto: una decisión rápida puede salvar la temporada o romper la confianza. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La cancha del viejo rival lejos de casa — Mejor etapa”."
    stage: prime
    category: capitanía
