  - id: childhood-026
    title: La deuda que nadie vio lejos de casa — Infancia y barrio
    description: "Una nota breve te cita en la cancha agrietada del barrio. tu madre va directo al asunto: el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Hay pocos minutos para decidir cómo quieres que termine “La deuda que nadie vio lejos de casa — Infancia y barrio”."
