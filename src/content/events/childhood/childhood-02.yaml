          - childhood-026-asumir-costo
  - id: childhood-027
    title: La llamada sin tu nombre lejos de casa — Infancia y barrio
    description: El entrenamiento debía ser normal en la radio comunitaria, pero tu capitán pide detenerlo. Cuenta delante de todos que un rival te ofrece una tregua que podría cambiar años de competencia. La decisión afectará tanto tu progreso como una relación importante. De pronto, “La llamada sin tu nombre lejos de casa — Infancia y barrio” deja de ser un problema privado.
    stage: childhood
    category: barrio
    tags:
      - barrio
      - childhood
      - independent
    rarity: common
    ageMin: 11
    ageMax: 12
    baseWeight: 10
    oncePerCareer: true
    choices:
      - id: ser-honesto
        text: Decir toda la verdad sobre “La llamada sin tu nombre lejos de casa — Infancia y barrio”, incluso si pierdes el lugar
        riskLabel: Resultado impredecible
        visibleHint: La transparencia protege tu futuro; la ocasión puede pasar.
        effects:
          - path: resilience
            operation: add
            value: 3
          - path: community
            operation: add
            value: -1
        result: La reacción en la radio comunitaria es más fría de lo que esperabas, pero tu capitán deja constancia de tu honestidad. La puerta no queda abierta del todo ni termina de cerrarse.
        flagsToAdd:
          - childhood-027-ser-honesto
      - id: competir
        text: Guardar el problema y competir mientras “La llamada sin tu nombre lejos de casa — Infancia y barrio” siga siendo posible
        riskLabel: Riesgo bajo
        visibleHint: Mantiene viva la ocasión, con un riesgo físico y emocional mayor.
        effects:
          - path: fitness
            operation: add
            value: 4
          - path: resilience
            operation: add
            value: -2
        result: Nadie descubre lo que callaste y consigues estar presente. Sin embargo, al salir de la radio comunitaria, sabes que la decisión volverá a medirse cuando el cuerpo o la memoria pasen factura.
        flagsToAdd:
          - childhood-027-competir
  - id: childhood-028
    title: La lista entreabierta lejos de casa — Infancia y barrio
    description: "De camino a el vestuario visitante, el técnico interino admite que lleva semanas ocultando algo: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. El episodio, que luego llamarán “La lista entreabierta lejos de casa — Infancia y barrio”, exige una respuesta antes de llegar."
