            operation: add
            value: -1
        result: Tu voz cambia la reunión en la radio comunitaria. No todos están de acuerdo, pero tu capitán deja de estar a solas y la relación adquiere una deuda nueva.
        flagsToAdd:
          - childhood-052-respaldar
