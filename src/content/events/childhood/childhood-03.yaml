  - id: childhood-051
    title: La deuda que nadie vio cuando cambió el vestuario — Infancia y barrio
    description: tu madre te espera en la cancha agrietada del barrio cuando el resto ya se ha marchado. Explica que el transporte cuesta más de lo que la familia puede pagar. Tu respuesta puede cambiar la manera en que te ve tu familia. Desde esa noche, todos recuerdan el episodio como “La deuda que nadie vio cuando cambió el vestuario — Infancia y barrio”.
