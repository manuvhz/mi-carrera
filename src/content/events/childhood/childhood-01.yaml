  - id: childhood-003
    title: La lista entreabierta junto a la familia — Infancia y barrio
    description: "Nadie pensaba hablar del asunto en el vestuario visitante, hasta que el técnico interino rompe el silencio: el entrenador premia la obediencia mientras tú ves un riesgo táctico. La prensa conocerá una parte, pero no las razones completas. La conversación que sigue convierte “La lista entreabierta junto a la familia — Infancia y barrio” en algo más importante que el resultado del fin de semana."
