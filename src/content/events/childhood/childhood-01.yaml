  - id: childhood-005
    title: La puerta inesperada junto a la familia — Infancia y barrio
    description: La rutina cambia al llegar a la oficina del club. Allí descubres junto a un cazatalentos de paso que tu nombre abre una puerta, pero también desplaza a otra persona. El resultado deportivo importa menos que la confianza que está en juego. Nadie levanta la voz, pero “La puerta inesperada junto a la familia — Infancia y barrio” puede dividir el antes y el después de esta temporada.
