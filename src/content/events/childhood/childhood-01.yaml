  - id: childhood-002
    title: La llamada sin tu nombre junto a la familia — Infancia y barrio
    description: "La noticia llega durante una jornada en la radio comunitaria: un rival te ofrece una tregua que podría cambiar años de competencia. tu capitán conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La llamada sin tu nombre junto a la familia — Infancia y barrio”."
