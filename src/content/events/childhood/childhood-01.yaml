  - id: childhood-004
    title: La promesa más larga junto a la familia — Infancia y barrio
    description: Al terminar la sesión en el aeropuerto de una ciudad desconocida, encuentras a la entrenadora de la selección con una propuesta inesperada. El problema es que dos personas que te ayudaron esperan decisiones incompatibles. El vestuario observará si tus palabras coinciden con tus actos. Tu respuesta dará sentido al recuerdo de “La promesa más larga junto a la familia — Infancia y barrio”.
