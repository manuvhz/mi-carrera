  - id: veteran-002
    title: La banca sin dueño junto a la familia — Madurez
    description: "La noticia llega durante una jornada en la despedida de un compañero: el partido más importante coincide con una fecha decisiva para tu hogar. el entrenador Salcedo conoce una salida, pero necesita saber qué estás dispuesto a ceder. La decisión afectará tanto tu progreso como una relación importante. Así comienza “La banca sin dueño junto a la familia — Madurez”."
